name: CI/Pipeline

on:
  push: 
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          run: |
             python -m pip3 install --upgrade pip3
             pip3 install -r requirements.txt
             pip3 install pytest pytest-cov flake8 black
      
      - name: 
        run: black --check .

      - name: Análise do código (flake8)
        run: flake8 . --max-line-length=88 --exclude=venv,__pycache__
        
      - name: Executar testes
        run: |
          pytest --cov=app --cov-report=xlm --cov-report=html
        env:
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key

      - name: Upload de relatório de cobertura
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
